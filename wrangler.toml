# Cloudflare Workers + static assets — required so CI `npx wrangler deploy` succeeds.
# Default deploy: Worker only (e.g. *.workers.dev). Custom domains only under [env.production].
name = "testing"
main = "workers/site.js"
compatibility_date = "2026-09-12"

[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "404-page"
html_handling = "drop-trailing-slash"
# Sitemap + robots MUST be asset-first (never Worker-rewritten) so Google can
# fetch them reliably. HTML still runs through the Worker for host redirects.
run_worker_first = [
  "/*",
  "!/sitemap.xml",
  "!/robots.txt",
  "!/sitemap.css",
  "!/favicon.svg",
  "!/_astro/*",
  "!/media/*",
  "!/videos/*",
  "!/og/*",
]

# Production: apex only (www.theislecheats.cc has no DNS today).
#   npx wrangler deploy --env production
[env.production]
name = "theisleqrhe"

[[env.production.routes]]
pattern = "theislecheats.cc"
custom_domain = true

[env.production.assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "404-page"
html_handling = "drop-trailing-slash"
run_worker_first = [
  "/*",
  "!/sitemap.xml",
  "!/robots.txt",
  "!/sitemap.css",
  "!/favicon.svg",
  "!/_astro/*",
  "!/media/*",
  "!/videos/*",
  "!/og/*",
]
