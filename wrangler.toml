# Cloudflare Workers + static assets — required so CI `npx wrangler deploy` succeeds.
name = "testing"
main = "workers/site.js"
compatibility_date = "2026-09-12"

[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "404-page"
html_handling = "drop-trailing-slash"
# Sitemap/robots/txt are handled in Worker code (embedded payload). Do NOT
# exclude them — exclusions previously caused crawler HTTP 500s on some edges.
run_worker_first = [
  "/*",
  "!/sitemap.css",
  "!/favicon.svg",
  "!/_astro/*",
  "!/media/*",
  "!/videos/*",
  "!/og/*",
]

[env.production]
name = "theisleqrhe"

[[env.production.routes]]
pattern = "theislecheats.cc"
custom_domain = true

[env.production.assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "404-page"
html_handling = "drop-trailing-slash"
run_worker_first = [
  "/*",
  "!/sitemap.css",
  "!/favicon.svg",
  "!/_astro/*",
  "!/media/*",
  "!/videos/*",
  "!/og/*",
]
